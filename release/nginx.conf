# Unlisted: nothing here is for search engines. latest.json and the scripts are never cached, so a new release shows
# at once; a tarball never changes once published (its name carries its version).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Plain http goes to https. TLS ends at Cloudflare and the reverse proxy in front always sends
    # X-Forwarded-Proto https, so the visitor's scheme comes from Cloudflare's CF-Visitor header. A request without it
    # (the proxy's own health checks) is served.
    if ($http_cf_visitor ~ '"scheme":"http"') {
        return 301 https://$host$request_uri;
    }

    location ~ ^/latest\.json(\.sig)?$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ~ ^/(get\.sh|nyx-monitor-update)$ {
        default_type text/plain;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location /releases/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
